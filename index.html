<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="description" content="Basu Saha — Independent book cover designer creating conceptual, literary and contemporary book covers.">

  <title>Basu Saha — Book Cover Designer</title>

  <link rel="icon" type="image/webp" href="logo.webp">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap"
    rel="stylesheet"
  >

  <style>
    :root {
      --sans: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI",
        Helvetica, Arial, sans-serif;

      --gutter: clamp(6px, 1.2vw, 10px);
      --margin: clamp(10px, 2vw, 20px);

      --bg: #faf9f6;
      --bg-raised: #efeee9;
      --header-bg: rgba(250, 249, 246, 0.82);
      --line: #e3e1da;

      --ink: #17161a;
      --ink-dim: #75747a;

      --accent: #f5e400;
      --accent-ink: #0b0b0c;

      --modal-title-color: #f4f2ee;
      --modal-desc-color: #96959b;
    }

    html[data-theme="dark"] {
      --bg: #111111;
      --bg-raised: #1b1b1b;
      --header-bg: rgba(17, 17, 17, 0.84);
      --line: #2b2b2b;

      --ink: #f3f2ee;
      --ink-dim: #999999;

      --accent: #f5e400;
      --accent-ink: #0b0b0c;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: var(--sans);
      font-weight: 400;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
      transition:
        background-color 0.25s ease,
        color 0.25s ease;
    }

    body,
    button,
    a {
      font-family: var(--sans);
    }

    html.theme-changing *,
    html.theme-changing *::before,
    html.theme-changing *::after {
      transition: none !important;
    }

    /* =========================
       HEADER
    ========================= */

    header {
      position: sticky;
      top: 0;
      z-index: 100;

      width: 100%;

      display: flex;
      align-items: center;
      justify-content: space-between;

      padding: 14px var(--margin);

      background: var(--header-bg);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);

      border-bottom: 1px solid transparent;

      transition:
        background-color 0.25s ease,
        border-color 0.25s ease;
    }

    header.scrolled {
      border-bottom-color: var(--line);
    }

    .logo {
      display: inline-flex;
      align-items: center;
      gap: 8px;

      color: var(--ink);
      text-decoration: none;

      font-size: 0.9rem;
      font-weight: 400;
      letter-spacing: 0.01em;

      white-space: nowrap;
    }

    .logo img {
      width: 28px;
      height: 28px;

      object-fit: cover;
      border-radius: 50%;

      display: block;
      flex-shrink: 0;
    }

    nav {
      display: flex;
      align-items: center;
      gap: 18px;
    }

    nav a {
      color: var(--ink);
      text-decoration: none;

      font-size: 0.78rem;
      font-weight: 400;

      transition: opacity 0.2s ease;
    }

    nav a:hover {
      opacity: 0.55;
    }

    /* =========================
       THEME TOGGLE
    ========================= */

    .theme-toggle {
      all: unset;

      width: 34px;
      height: 20px;

      display: block;
      position: relative;

      border: 1px solid var(--ink-dim);
      border-radius: 999px;

      cursor: pointer;
      opacity: 0.85;

      transition:
        border-color 0.2s ease,
        opacity 0.2s ease;
    }

    .theme-toggle:hover {
      opacity: 1;
    }

    .theme-toggle::after {
      content: "";

      position: absolute;

      top: 3px;
      left: 3px;

      width: 12px;
      height: 12px;

      border-radius: 50%;

      background: var(--ink);

      transition:
        transform 0.25s ease,
        background-color 0.25s ease;
    }

    html[data-theme="dark"] .theme-toggle::after {
      transform: translateX(14px);
      background: var(--accent);
    }

    /* =========================
       WORK / GALLERY
    ========================= */

    #work {
      padding: 8px var(--margin) 0;
    }

    .gallery {
      display: grid;

      grid-template-columns: repeat(3, minmax(0, 1fr));

      gap: 8px;
    }

    .gallery-item {
      position: relative;

      width: 100%;

      padding: 0;
      margin: 0 0 8px;

      border: 0;
      background: transparent;

      cursor: pointer;

      overflow: hidden;
      border-radius: 8px;

      display: block;

      -webkit-tap-highlight-color: transparent;
    }

    .gallery-item img {
      width: 100%;
      height: auto;

      display: block;

      border-radius: 8px;

      transition:
        transform 0.45s cubic-bezier(.2, .7, .2, 1),
        opacity 0.25s ease;
    }

    .gallery-item:hover img {
      transform: scale(1.03);
    }

    .gallery-item:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 3px;
    }

    /* =========================
       ABOUT
    ========================= */

    #about {
      padding: 100px var(--margin) 120px;
    }

    .about-inner {
      max-width: 720px;
    }

    .about-inner p {
      margin: 0;

      font-size: clamp(1.5rem, 3.2vw, 3rem);
      line-height: 1.08;

      letter-spacing: -0.045em;
      font-weight: 400;
    }

    /* =========================
       CONTACT
    ========================= */

    #contact {
      background: var(--accent);
      color: var(--accent-ink);

      padding: 90px var(--margin) 100px;
    }

    .contact-inner {
      display: flex;
      flex-direction: column;
      gap: 35px;

      max-width: 900px;
    }

    .contact-title {
      margin: 0;

      font-size: clamp(2.2rem, 6vw, 5.5rem);
      line-height: 0.95;

      letter-spacing: -0.055em;
      font-weight: 500;
    }

    .contact-email {
      display: inline-block;

      width: fit-content;

      color: var(--accent-ink);
      text-decoration: none;

      font-size: clamp(1rem, 2vw, 1.25rem);

      border-bottom: 1px solid currentColor;
      padding-bottom: 3px;

      transition: opacity 0.2s ease;
    }

    .contact-email:hover {
      opacity: 0.55;
    }

    .contact-social {
      display: inline-block;

      width: fit-content;

      color: var(--accent-ink);
      text-decoration: none;

      font-size: 0.85rem;

      transition: opacity 0.2s ease;
    }

    .contact-social:hover {
      opacity: 0.55;
    }

    /* =========================
       FOOTER
    ========================= */

    footer {
      display: flex;
      align-items: center;
      justify-content: space-between;

      gap: 20px;

      padding: 18px var(--margin);

      background: var(--bg);

      color: var(--ink-dim);

      font-size: 0.7rem;

      transition:
        background-color 0.25s ease,
        color 0.25s ease;
    }

    .footer-status {
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .live-dot {
      width: 5px;
      height: 5px;

      flex: 0 0 5px;

      border-radius: 50%;

      background: #f5e400;

      display: inline-block;
    }

    /* =========================
       LIGHTBOX
    ========================= */

    .modal {
      position: fixed;
      inset: 0;

      z-index: 1000;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 40px 20px;

      background: rgba(10, 10, 10, 0.94);

      opacity: 0;
      visibility: hidden;

      transition:
        opacity 0.3s ease,
        visibility 0.3s ease;
    }

    .modal.open {
      opacity: 1;
      visibility: visible;
    }

    .modal-content {
      position: relative;

      width: min(100%, 1000px);
      max-height: 92vh;

      display: flex;
      flex-direction: column;
      align-items: center;

      overflow: auto;
    }

    .modal-image {
      display: block;

      max-width: 100%;
      max-height: 68vh;

      width: auto;
      height: auto;

      object-fit: contain;

      border-radius: 3px;

      transform: scale(0.97);
      opacity: 0;

      transition:
        transform 0.35s ease,
        opacity 0.35s ease;
    }

    .modal.open .modal-image {
      transform: scale(1);
      opacity: 1;
    }

    .modal-info {
      width: 100%;

      padding-top: 20px;

      text-align: left;
    }

    .modal-title {
      margin: 0;

      color: var(--modal-title-color);

      font-size: 0.9rem;
      line-height: 1.4;

      font-weight: 400;
    }

    .modal-title a {
      color: inherit;
      text-decoration: none;

      border-bottom: 1px solid rgba(244, 242, 238, 0.4);

      transition: border-color 0.2s ease;
    }

    .modal-title a:hover {
      border-color: rgba(244, 242, 238, 1);
    }

    .modal-description {
      margin: 7px 0 0;

      color: var(--modal-desc-color);

      font-size: 0.75rem;
      line-height: 1.5;
    }

    .modal-close {
      position: fixed;

      top: 18px;
      right: 20px;

      width: 36px;
      height: 36px;

      padding: 0;

      border: 0;
      background: transparent;

      color: #fff;

      cursor: pointer;

      font-size: 25px;
      font-weight: 300;
      line-height: 1;

      opacity: 0.8;

      transition: opacity 0.2s ease;
    }

    .modal-close:hover {
      opacity: 1;
    }

    /* =========================
       DESKTOP
    ========================= */

    @media (min-width: 1000px) {

      header {
        padding: 16px var(--margin);
      }

      .logo {
        font-size: 0.92rem;
      }

      .gallery {
        grid-template-columns: repeat(5, minmax(0, 1fr));
        gap: 16px;
      }

      .gallery-item {
        margin-bottom: 16px;
      }

      #work {
        padding: 16px var(--margin) 0;
      }

      #about {
        padding-top: 150px;
        padding-bottom: 170px;
      }

      #contact {
        padding-top: 120px;
        padding-bottom: 130px;
      }
    }

    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 600px) {

      header {
        padding: 14px var(--margin);
      }

      .logo {
        font-size: 0.82rem;
        gap: 7px;
      }

      .logo img {
        width: 26px;
        height: 26px;
      }

      nav {
        gap: 14px;
      }

      nav a {
        font-size: 0.78rem;
      }

      .theme-toggle {
        width: 32px;
        height: 19px;
      }

      .theme-toggle::after {
        width: 11px;
        height: 11px;
        top: 3px;
        left: 3px;
      }

      html[data-theme="dark"] .theme-toggle::after {
        transform: translateX(13px);
      }

      #work {
        padding: 8px var(--margin) 0;
      }

      .gallery {
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 8px;
      }

      .gallery-item {
        margin-bottom: 8px;
        border-radius: 6px;
      }

      .gallery-item img {
        border-radius: 6px;
      }

      #about {
        padding: 80px var(--margin) 100px;
      }

      .about-inner p {
        font-size: clamp(1.5rem, 7vw, 2.2rem);
      }

      #contact {
        padding: 70px var(--margin) 80px;
      }

      footer {
        font-size: 0.65rem;
      }

      .modal {
        padding: 50px 14px 25px;
      }

      .modal-image {
        max-height: 70vh;
      }

      .modal-info {
        padding-top: 15px;
      }
    }
  </style>

  <script>
    (function () {
      const savedTheme = localStorage.getItem('basu-theme');

      if (savedTheme === 'dark') {
        document.documentElement.setAttribute('data-theme', 'dark');
      } else {
        document.documentElement.setAttribute('data-theme', 'light');
      }
    })();
  </script>
</head>

<body>

  <!-- =========================
       HEADER
  ========================== -->

  <header id="siteHeader">

    <a class="logo" href="#top" id="top">
      <img src="logo.webp" alt="Basu Saha logo">
      <span>Basu Saha</span>
    </a>

    <nav>
      <a href="#work">Work</a>
      <a href="#about">About</a>
      <a href="#contact">Contact</a>

      <button
        class="theme-toggle"
        id="themeToggle"
        type="button"
        aria-label="Switch to dark mode"
        title="Switch to dark mode"
      ></button>
    </nav>

  </header>


  <!-- =========================
       WORK
  ========================== -->

  <main>

    <section id="work">

      <div class="gallery" id="gallery"></div>

    </section>


    <!-- =========================
         ABOUT
    ========================== -->

    <section id="about">

      <div class="about-inner">
        <p>
          Basu Saha is an independent book cover designer.
        </p>
      </div>

    </section>


    <!-- =========================
         CONTACT
    ========================== -->

    <section id="contact">

      <div class="contact-inner">

        <h2 class="contact-title">
          Have a book<br>
          in mind?
        </h2>

        <a
          class="contact-email"
          href="mailto:basudebsaha564@gmail.com"
        >
          basudebsaha564@gmail.com
        </a>

        <a
          class="contact-social"
          href="https://www.instagram.com/basusaha_?stkn=MXM4NjQ2M2YyZ3M5cw=="
          target="_blank"
          rel="noopener noreferrer"
        >
          Instagram ↗
        </a>

      </div>

    </section>

  </main>


  <!-- =========================
       FOOTER
  ========================== -->

  <footer>

    <div class="footer-status">
      <span>© 2026 Basu Saha</span>
      <span
        class="live-dot"
        aria-label="Site live"
        title="Site live"
      ></span>
    </div>

    <div>
      Book Cover Designer
    </div>

  </footer>


  <!-- =========================
       LIGHTBOX
  ========================== -->

  <div
    class="modal"
    id="modal"
    aria-hidden="true"
  >

    <button
      class="modal-close"
      id="modalClose"
      type="button"
      aria-label="Close"
    >
      ×
    </button>

    <div class="modal-content">

      <img
        class="modal-image"
        id="modalImage"
        src=""
        alt=""
      >

      <div class="modal-info">

        <h2
          class="modal-title"
          id="modalTitle"
        ></h2>

        <p
          class="modal-description"
          id="modalDescription"
        ></p>

      </div>

    </div>

  </div>


  <!-- =========================
       JAVASCRIPT
  ========================== -->

  <script>

    /* =========================
       COVER DATA
    ========================= */

    const covers = [

      {
        src: "astralabyssconcept.webp",
        title: "Astral Abyss • Nelson Mwova",
        desc: "Concept Cover design."
      },

      {
        src: "drivered.webp",
        title: "Drive Your Plow Over the Bones of the Dead • Olga Tokarczuk",
        desc: "CConcept Cover design."
      },

      {
        src: "quiet.webp",
        title: "Quiet Ruin",
        desc: "Cover Design for an upcoming debut novel"
      },

      {
        src: "Deoliphoto.webp",
        title: "The Night Train at Deoli • Ruskin Bond",
        desc: "Concept cover design for one of my most favourite short stories."
      },

      {
        src: "Deoli.webp",
        title: "The Night Train at Deoli • Ruskin Bond",
        desc: "Concept cover design for one of my most favourite short stories."
      },

      {
        src: "theeyeshaveit.webp",
        title: "The Eyes Have It • Ruskin Bond",
        desc: "Concept cover design."
      },

      {
        src: "astralabyss.webp",
        title: "Astral Abyss • Nelson Mwova",
        desc: "Official cover design.",
        link: "https://amzn.in/d/0fK2A5ND"
      },

      {
        src: "whitenight.webp",
        title: "WHite NIght • Fyodor Dostoevsky",
        desc: "Concept cover design."
      },

      {
        src: "Untitled_Artwork-10.webp",
        title: "Drive Your Plow Over the Bones of the Dead • Olga Tokarczuk",
        desc: "Concept Cover design."
      }

    ];


    /* =========================
       GALLERY
    ========================== */

    const gallery = document.getElementById("gallery");

    covers.forEach((cover, index) => {

      const button = document.createElement("button");

      button.className = "gallery-item";
      button.type = "button";

      button.setAttribute(
        "aria-label",
        `Open ${cover.title}`
      );

      const image = document.createElement("img");

      image.src = cover.src;
      image.alt = cover.title;
      image.loading = index < 6 ? "eager" : "lazy";
      image.decoding = "async";

      button.appendChild(image);

      button.addEventListener("click", () => {
        openModal(cover);
      });

      gallery.appendChild(button);

    });


    /* =========================
       MODAL
    ========================== */

    const modal = document.getElementById("modal");
    const modalImage = document.getElementById("modalImage");
    const modalTitle = document.getElementById("modalTitle");
    const modalDescription = document.getElementById("modalDescription");
    const modalClose = document.getElementById("modalClose");


    function openModal(cover) {

      modalImage.src = cover.src;
      modalImage.alt = cover.title;

      if (cover.link) {

        modalTitle.innerHTML = `
          <a
            href="${cover.link}"
            target="_blank"
            rel="noopener noreferrer"
          >
            ${cover.title}
          </a>
        `;

      } else {

        modalTitle.textContent = cover.title;

      }

      modalDescription.textContent = cover.desc;

      modal.classList.add("open");
      modal.setAttribute("aria-hidden", "false");

      document.body.style.overflow = "hidden";

    }


    function closeModal() {

      modal.classList.remove("open");
      modal.setAttribute("aria-hidden", "true");

      document.body.style.overflow = "";

      setTimeout(() => {
        if (!modal.classList.contains("open")) {
          modalImage.src = "";
        }
      }, 300);

    }


    modalClose.addEventListener("click", closeModal);


    modal.addEventListener("click", (event) => {

      if (event.target === modal) {
        closeModal();
      }

    });


    document.addEventListener("keydown", (event) => {

      if (event.key === "Escape") {
        closeModal();
      }

    });


    /* =========================
       THEME TOGGLE
    ========================== */

    const themeToggle =
      document.getElementById("themeToggle");


    function updateThemeButton() {

      const isDark =
        document.documentElement.getAttribute("data-theme") === "dark";

      themeToggle.setAttribute(
        "aria-label",
        isDark
          ? "Switch to light mode"
          : "Switch to dark mode"
      );

      themeToggle.setAttribute(
        "title",
        isDark
          ? "Switch to light mode"
          : "Switch to dark mode"
      );

    }


    updateThemeButton();


    themeToggle.addEventListener("click", () => {

      document.documentElement.classList.add("theme-changing");

      const currentTheme =
        document.documentElement.getAttribute("data-theme");

      const newTheme =
        currentTheme === "dark"
          ? "light"
          : "dark";

      document.documentElement.setAttribute(
        "data-theme",
        newTheme
      );

      localStorage.setItem(
        "basu-theme",
        newTheme
      );

      updateThemeButton();

      requestAnimationFrame(() => {

        requestAnimationFrame(() => {

          document.documentElement.classList.remove(
            "theme-changing"
          );

        });

      });

    });


    /* =========================
       HEADER SCROLL STATE
    ========================== */

    const siteHeader =
      document.getElementById("siteHeader");


    function updateHeader() {

      if (window.scrollY > 8) {

        siteHeader.classList.add("scrolled");

      } else {

        siteHeader.classList.remove("scrolled");

      }

    }


    updateHeader();

    window.addEventListener(
      "scroll",
      updateHeader,
      { passive: true }
    );

  </script>

</body>
</html>
