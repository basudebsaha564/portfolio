<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Basu Saha — independent book cover designer crafting visual identities for authors and publishers.">
<title>Basu Saha — Book Cover Designer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<script>
  (function() {
    const savedTheme = localStorage.getItem('theme');
    if (savedTheme === 'twilight') {
      document.documentElement.classList.add('twilight-mode');
    } else if (savedTheme === 'dark') {
      document.documentElement.classList.add('dark-mode');
    } else {
      document.documentElement.classList.add('light-mode');
    }
  })();
</script>

<style>
  :root {
    --sans: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    --gutter: clamp(6px, 1.2vw, 10px);
    --margin: clamp(10px, 2vw, 20px);
  }

  html.light-mode {
    /* 1. Light Theme */
    --bg: #faf9f6;
    --bg-raised: #efeee9;
    --header-bg: rgba(250, 249, 246, 0.82);
    --line: #e3e1da;
    --ink: #17161a;
    --ink-dim: #75747a;
    --accent: #f5e400;
    --accent-ink: #0b0b0c;
    --modal-title-color: #f4f2ee;
    --modal-desc-color: #96959b;
  }

  html.twilight-mode {
    /* 2. Twilight Theme (Dark Purple BG/Header, Lavender Contact Box) */
    --bg: #221929;
    --bg-raised: #35263f;
    --header-bg: rgba(34, 25, 41, 0.85);
    --line: #463354;
    --ink: #ffffff;
    --ink-dim: #cca8e9;
    --accent: #e9d5ff;
    --accent-ink: #221929;
    --modal-title-color: #ffffff;
    --modal-desc-color: #cca8e9;
  }

  html.dark-mode {
    /* 3. Dark Theme */
    --bg: #0b0b0c;
    --bg-raised: #151517;
    --header-bg: rgba(11, 11, 12, 0.82);
    --line: #232326;
    --ink: #f4f2ee;
    --ink-dim: #96959b;
    --accent: #f5e400;
    --accent-ink: #0b0b0c;
    --modal-title-color: #f4f2ee;
    --modal-desc-color: #96959b;
  }

  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    transition: background 0.3s ease, color 0.3s ease;
  }

  a { color: inherit; }

  :focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 3px;
  }

  @media (prefers-reduced-motion: reduce) {
    * { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
  }

  /* ---------- Header ---------- */
  header {
    position: sticky;
    top: 0;
    z-index: 100;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 16px var(--margin);
    background: var(--header-bg);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border-bottom: 1px solid transparent;
    transition: border-color 0.3s ease, background 0.3s ease;
  }

  header.scrolled { border-bottom-color: var(--line); }

  .logo {
    font-family: var(--sans);
    font-size: 1.05rem;
    font-weight: 600;
    letter-spacing: -0.01em;
    text-decoration: none;
  }

  nav { display: flex; align-items: center; gap: 24px; }

  nav a {
    color: var(--ink-dim);
    text-decoration: none;
    font-size: 0.9rem;
    transition: color 0.2s ease;
  }

  nav a:hover { color: var(--ink); }

  /* ---------- Minimalist SVG Switch ---------- */
  .theme-toggle {
    all: unset;
    cursor: pointer;
    color: var(--ink-dim);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2px;
    border-radius: 4px;
    transition: color 0.2s ease, opacity 0.2s ease;
  }

  .theme-toggle:hover {
    color: var(--ink);
    opacity: 0.85;
  }

  .theme-toggle svg {
    width: 18px;
    height: 18px;
    stroke: currentColor;
    stroke-width: 1.75;
    stroke-linecap: round;
    stroke-linejoin: round;
    fill: none;
  }

  /* Icon visibility mapping */
  .icon-sparkle { display: block; }
  .icon-moon { display: none; }
  .icon-sun { display: none; }

  html.twilight-mode .icon-sparkle { display: none; }
  html.twilight-mode .icon-moon { display: block; }
  html.twilight-mode .icon-sun { display: none; }

  html.dark-mode .icon-sparkle { display: none; }
  html.dark-mode .icon-moon { display: none; }
  html.dark-mode .icon-sun { display: block; }

  /* ---------- Gallery ---------- */
  #work { padding: 0 var(--gutter) 8px; }

  .gallery {
    column-count: 3;
    column-gap: var(--gutter);
  }

  .gallery-item {
    break-inside: avoid;
    margin-bottom: var(--gutter);
    cursor: pointer;
    border-radius: 3px;
    overflow: hidden;
    background: var(--bg-raised);
    transition: background 0.3s ease;
  }

  .gallery-item img {
    width: 100%;
    height: auto;
    display: block;
    transition: transform 0.4s cubic-bezier(0.2, 0.7, 0.3, 1), opacity 0.4s ease;
  }

  .gallery-item:hover img,
  .gallery-item:focus-visible img {
    transform: scale(1.03);
  }

  .gallery-item button {
    all: unset;
    display: block;
    cursor: pointer;
  }

  /* ---------- About ---------- */
  #about {
    padding: clamp(56px, 10vw, 100px) var(--margin);
    border-top: 1px solid var(--line);
    max-width: 720px;
    transition: border-color 0.3s ease;
  }

  .eyebrow {
    font-size: 0.8rem;
    color: var(--ink-dim);
    margin-bottom: 16px;
  }

  .about-text {
    font-family: var(--sans);
    font-size: clamp(1.2rem, 2.4vw, 1.5rem);
    font-weight: 400;
    line-height: 1.5;
    color: var(--ink);
  }

  /* ---------- Contact ---------- */
  #contact {
    background: var(--accent);
    color: var(--accent-ink);
    padding: clamp(56px, 10vw, 100px) var(--margin);
    transition: background 0.3s ease, color 0.3s ease;
  }

  #contact .eyebrow { color: var(--accent-ink); opacity: 0.7; }

  .contact-email {
    font-family: var(--sans);
    font-size: clamp(1.3rem, 3vw, 1.8rem);
    font-weight: 600;
    letter-spacing: -0.01em;
    margin-bottom: 18px;
    word-break: break-word;
  }

  .contact-email a { text-decoration: none; }
  .contact-email a:hover { text-decoration: underline; }

  .contact-link {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 0.95rem;
    font-weight: 500;
    color: var(--accent-ink);
    text-decoration: none;
    border-bottom: 1px solid currentColor;
    padding-bottom: 2px;
    transition: opacity 0.2s ease;
  }

  .contact-link:hover { opacity: 0.65; }

  /* ---------- Footer ---------- */
  footer {
    display: flex;
    justify-content: space-between;
    padding: 16px var(--margin);
    background: var(--bg);
    color: var(--ink-dim);
    font-size: 0.78rem;
    transition: background 0.3s ease;
  }

  /* ---------- Lightbox ---------- */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(6, 6, 7, 0.9);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 1000;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s ease;
    padding: 24px;
  }

  .modal-overlay.active {
    opacity: 1;
    pointer-events: auto;
  }

  .modal-content {
    width: fit-content;
    max-width: 440px;
    max-height: 90vh;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    transform: translateY(8px) scale(0.98);
    transition: transform 0.25s ease;
  }

  .modal-overlay.active .modal-content {
    transform: translateY(0) scale(1);
  }

  .modal-content img {
    width: auto;
    max-width: 100%;
    max-height: 68vh;
    object-fit: contain;
    border-radius: 3px;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
  }

  .modal-info {
    margin-top: 16px;
    width: 100%;
    text-align: left;
  }

 .modal-title {
  display: inline-block;
  font-family: var(--sans);
  font-size: 1rem;
  font-weight: 600;
  color: var(--modal-title-color);
  margin-bottom: 4px;
  text-decoration: none;
}

.modal-title:hover {
  text-decoration: underline;
}

  .modal-description {
    font-size: 0.88rem;
    color: var(--modal-desc-color);
  }

  .modal-close {
    all: unset;
    position: absolute;
    top: 20px;
    right: 20px;
    width: 40px;
    height: 40px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--modal-desc-color);
    cursor: pointer;
    font-size: 1.4rem;
    transition: color 0.2s ease;
  }

  .modal-close:hover { color: var(--modal-title-color); }
</style>
</head>
<body>

<header id="siteHeader">
  <a class="logo" href="#top" id="top">Basu Saha</a>
  <nav>
    <a href="#work">Work</a>
    <a href="#about">About</a>
    <a href="#contact">Contact</a>
    <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme">
      <!-- Sparkle Icon: Light -> Twilight -->
      <svg class="icon-sparkle" viewBox="0 0 24 24">
        <path d="M12 2L14.5 9.5L22 12L14.5 14.5L12 22L9.5 14.5L2 12L9.5 9.5L12 2Z"></path>
      </svg>
      <!-- Moon Icon: Twilight -> Dark -->
      <svg class="icon-moon" viewBox="0 0 24 24">
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
      </svg>
      <!-- Sun Icon: Dark -> Light -->
      <svg class="icon-sun" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="5"></circle>
        <line x1="12" y1="1" x2="12" y2="3"></line>
        <line x1="12" y1="21" x2="12" y2="23"></line>
        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
        <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
        <line x1="1" y1="12" x2="3" y2="12"></line>
        <line x1="21" y1="12" x2="23" y2="12"></line>
        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
        <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
      </svg>
    </button>
  </nav>
</header>

<section id="work">
  <div class="gallery" id="gallery"></div>
</section>

<section id="about">
  <div class="eyebrow">About</div>
  <p class="about-text">Basu Saha is an independent book cover designer.</p>
</section>

<section id="contact">
  <div class="eyebrow">Contact</div>
  <div class="contact-email"><a href="mailto:basudebsaha564@gmail.com">basudebsaha564@gmail.com</a></div>
  <a class="contact-link" href="https://www.instagram.com/basusaha_?stkn=MXM4NjQ2M2YyZ3M5cw==" target="_blank" rel="noopener">Instagram ↗</a>
</section>

<footer>
  <div>© 2026 Basu Saha</div>
  <div>Book Cover Designer</div>
</footer>

<div class="modal-overlay" id="imageModal" role="dialog" aria-modal="true" aria-hidden="true">
  <button class="modal-close" id="modalClose" aria-label="Close">×</button>
  <div class="modal-content">
    <img src="" id="modalImg" alt="">
    <div class="modal-info">
      <a class="modal-title" id="modalTitle" href="#" target="_blank" rel="noopener"></a>
      <div class="modal-description" id="modalDesc"></div>
    </div>
  </div>
</div>

<script>
  const themeToggleBtn = document.getElementById('themeToggle');
  const htmlEl = document.documentElement;

  themeToggleBtn.addEventListener('click', () => {
    if (htmlEl.classList.contains('light-mode')) {
      htmlEl.classList.remove('light-mode');
      htmlEl.classList.add('twilight-mode');
      localStorage.setItem('theme', 'twilight');
    } else if (htmlEl.classList.contains('twilight-mode')) {
      htmlEl.classList.remove('twilight-mode');
      htmlEl.classList.add('dark-mode');
      localStorage.setItem('theme', 'dark');
    } else {
      htmlEl.classList.remove('dark-mode');
      htmlEl.classList.add('light-mode');
      localStorage.setItem('theme', 'light');
    }
  });

  const covers = [
    { src: "astralabyssconcept.webp", title: "Astral Abyss • Nelson Mwova", desc: "Concept Cover design." },
    { src: "https://picsum.photos/id/1025/600/700", title: "White Nights • Fyodor Dostoevsky", desc: "Minimalist modern classics series concept." },
    { src: "https://picsum.photos/id/1040/600/1000", title: "Astral Abyss • Nelson Mwova", desc: "Sci-fi retro pixel art cover redesign." },
    { src: "https://picsum.photos/id/1069/600/800", title: "Editorial Project • 2026", desc: "Custom typography and visual identity." },
    { src: "https://picsum.photos/id/1084/600/950", title: "Novel Edition • Special Print", desc: "Custom graphic treatment & jacket design." },
    { src: "https://picsum.photos/id/1062/600/750", title: "Visual Identity • Author Series", desc: "Complete book jacket and spine design." },
    { src: "https://picsum.photos/id/1035/600/850", title: "Contemporary Fiction • Edition", desc: "Minimal artwork with a focus on typography." },
    { src: "https://picsum.photos/id/1050/600/920", title: "Poetry Collection • Cover", desc: "Abstract layout design for a limited print run." },
    { src: "https://picsum.photos/id/1060/600/780", title: "Anthology Cover Design", desc: "Custom illustration and typography direction." }
  ];

  const gallery = document.getElementById('gallery');
  gallery.innerHTML = covers.map((c, i) => `
    <div class="gallery-item">
      <button data-index="${i}" aria-label="View ${c.title}">
        <img src="${c.src}" alt="${c.title}" loading="${i < 4 ? 'eager' : 'lazy'}">
      </button>
    </div>
  `).join('');

  const modal = document.getElementById('imageModal');
  const modalImg = document.getElementById('modalImg');
  const modalTitle = document.getElementById('modalTitle');
  const modalDesc = document.getElementById('modalDesc');
  const modalClose = document.getElementById('modalClose');
  let lastFocused = null;

  function openModal(index) {
    const c = covers[index];
    modalImg.src = c.src;
    modalImg.alt = c.title;
    modalTitle.textContent = c.title;
modalDesc.textContent = c.desc;

if (c.link) {
  modalTitle.href = c.link;
  modalTitle.target = "_blank";
  modalTitle.rel = "noopener";
  modalTitle.style.pointerEvents = "auto";
  modalTitle.style.cursor = "pointer";
} else {
  modalTitle.removeAttribute("href");
  modalTitle.removeAttribute("target");
  modalTitle.removeAttribute("rel");
  modalTitle.style.pointerEvents = "none";
  modalTitle.style.cursor = "default";
}

lastFocused = document.activeElement;
    modal.classList.add('active');
    modal.setAttribute('aria-hidden', 'false');
    modalClose.focus();
  }

  function closeModal() {
    modal.classList.remove('active');
    modal.setAttribute('aria-hidden', 'true');
    if (lastFocused) lastFocused.focus();
  }

  gallery.addEventListener('click', (e) => {
    const btn = e.target.closest('button[data-index]');
    if (btn) openModal(Number(btn.dataset.index));
  });

  modal.addEventListener('click', (e) => {
    if (e.target === modal) closeModal();
  });

  modalClose.addEventListener('click', closeModal);

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && modal.classList.contains('active')) closeModal();
  });

  const header = document.getElementById('siteHeader');
  window.addEventListener('scroll', () => {
    header.classList.toggle('scrolled', window.scrollY > 8);
  }, { passive: true });
</script>

</body>
</html>
