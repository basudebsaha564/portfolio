<style>
:root {
  --sans: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  --gutter: clamp(6px, 1.2vw, 10px);
  --margin: clamp(10px, 2vw, 20px);

  /* Light theme */
  --bg: #faf9f6;
  --bg-raised: #efeee9;
  --header-bg: rgba(250, 249, 246, 0.82);
  --line: #e3e1da;
  --ink: #17161a;
  --ink-dim: #75747a;
  --accent: #f5e400;
  --accent-ink: #0b0b0c;
  --modal-title-color: #f4f2ee;
  --modal-desc-color: #96959b;
}

* {
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--sans);
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  transition: background 0.3s ease, color 0.3s ease;
}

a {
  color: inherit;
}

:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 3px;
}

@media (prefers-reduced-motion: reduce) {
  * {
    animation-duration: 0.01ms !important;
    transition-duration: 0.01ms !important;
  }
}

/* ---------- Header ---------- */

header {
  position: sticky;
  top: 0;
  z-index: 100;
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 16px var(--margin);
  background: var(--header-bg);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  border-bottom: 1px solid transparent;
  transition: border-color 0.3s ease, background 0.3s ease;
}

header.scrolled {
  border-bottom-color: var(--line);
}

.logo {
  display: flex;
  align-items: center;
  gap: 9px;
  font-family: var(--sans);
  font-size: 1.05rem;
  font-weight: 600;
  letter-spacing: -0.01em;
  text-decoration: none;
}

.logo img {
  width: 28px;
  height: 28px;
  border-radius: 50%;
  object-fit: cover;
  display: block;
}

nav {
  display: flex;
  align-items: center;
  gap: 24px;
}

nav a {
  color: var(--ink-dim);
  text-decoration: none;
  font-size: 0.9rem;
  transition: color 0.2s ease;
}

nav a:hover {
  color: var(--ink);
}

/* ---------- Gallery ---------- */

#work {
  padding: 8px;
}

.gallery {
  column-count: 3;
  column-gap: 8px;
}

.gallery-item {
  break-inside: avoid;
  margin-bottom: 8px;
  cursor: pointer;
  border-radius: 0;
  overflow: hidden;
  background: var(--bg-raised);
  transition: background 0.3s ease;
}

.gallery-item img {
  width: 100%;
  height: auto;
  display: block;
  transition: transform 0.4s cubic-bezier(0.2, 0.7, 0.3, 1), opacity 0.4s ease;
}

.gallery-item:hover img,
.gallery-item:focus-within img {
  transform: scale(1.03);
}

.gallery-item button {
  all: unset;
  display: block;
  width: 100%;
  cursor: pointer;
}

/* ---------- Desktop: 5 columns ---------- */

@media (min-width: 1024px) {
  #work {
    padding: 16px;
  }

  .gallery {
    column-count: 5;
    column-gap: 16px;
  }

  .gallery-item {
    margin-bottom: 16px;

}

/* ---------- About ---------- */

#about {
  padding: clamp(56px, 10vw, 100px) var(--margin);
  border-top: 1px solid var(--line);
  max-width: 720px;
  transition: border-color 0.3s ease;

.eyebrow {

  color: var(--ink-dim);
  margin-bottom: 16px;
}

.about-text {
  font-family: var(--sans);
  font-size: clamp(1.2rem, 2.4vw, 1.5rem);
  font-weight: 400;
  line-height: 1.5;
  color: var(--ink);
  margin: 0;
}

/* ---------- Contact ---------- */

#contact {

  color: var(--accent-ink);
  padding: clamp(56px, 10vw, 100px) var(--margin);
  transition: background 0.3s ease, color 0.3s ease;
}

#contact .eyebrow {
  color: var(--accent-ink);
  opacity: 0.7;
}

.contact-email {

  font-size: clamp(1.3rem, 3vw, 1.8rem);
  font-weight: 600;
  letter-spacing: -0.01em;
  margin-bottom: 18px;
  word-break: break-word;
}

.contact-email a {
  text-decoration: none;
}

.contact-email a:hover {
  text-decoration: underline;
}

.contact-link {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 0.95rem;
  font-weight: 500;
  color: var(--accent-ink);
  text-decoration: none;
  border-bottom: 1px solid currentColor;
  padding-bottom: 2px;
  transition: opacity 0.2s ease;
}

.contact-link:hover {
  opacity: 0.65;
}

/* ---------- Footer ---------- */

footer {
  display: flex;
  justify-content: space-between;
  padding: 16px var(--margin);
  background: var(--bg);
  color: var(--ink-dim);
  font-size: 0.78rem;
  transition: background 0.3s ease;
}

/* ---------- Lightbox ---------- */

.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(6, 6, 7, 0.9);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  display: flex;
  justify-content: center;
  align-items: center;
  z-index: 1000;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.25s ease;
  padding: 24px;
}

.modal-overlay.active {
  opacity: 1;
  pointer-events: auto;
}

.modal-content {
  width: fit-content;
  max-width: 440px;
  max-height: 90vh;
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  transform: translateY(8px) scale(0.98);
  transition: transform 0.25s ease;
}

.modal-overlay.active .modal-content {
  transform: translateY(0) scale(1);
}

.modal-content img {
  width: auto;
  max-width: 100%;
  max-height: 68vh;
  object-fit: contain;
  border-radius: 0;
  box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
}

.modal-info {
  margin-top: 16px;
  width: 100%;
  text-align: left;
}

.modal-title {
  display: inline-block;
  font-family: var(--sans);
  font-size: 1rem;
  font-weight: 600;
  color: var(--modal-title-color);
  margin-bottom: 4px;
  text-decoration: none;
}

.modal-title:hover {
  text-decoration: underline;
}

.modal-description {
  font-size: 0.88rem;
  color: var(--modal-desc-color);
}

.modal-close {
  all: unset;
  position: absolute;
  top: 20px;
  right: 20px;
  width: 40px;
  height: 40px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--modal-desc-color);
  cursor: pointer;
  font-size: 1.4rem;
  transition: color 0.2s ease;
}

.modal-close:hover {
  color: var(--modal-title-color);
}
</style>
</head>

<div

  aria-modal="true"
  aria-hidden="true"

    aria-label="Close"
  >
    ×

    <div class="modal-info">
      <a
        class="modal-title"
        id="modalTitle"

        target="_blank"
        rel="noopener"
      ></a>

    </div>

<script>
const gallery = document.getElementById('gallery');
const modal = document.getElementById('imageModal');
const modalImg = document.getElementById('modalImg');
const modalTitle = document.getElementById('modalTitle');
const modalDesc = document.getElementById('modalDesc');
const modalClose = document.getElementById('modalClose');

let lastFocused = null;

function openModal(btn) {
  const img = btn.querySelector('img');
  const title = btn.dataset.title || '';
  const desc = btn.dataset.desc || '';
  const link = btn.dataset.link;

  modalImg.src = img.currentSrc || img.src;
  modalImg.alt = img.alt;
  modalTitle.textContent = title;
  modalDesc.textContent = desc;

  if (link) {
    modalTitle.href = link;
    modalTitle.target = "_blank";
    modalTitle.rel = "noopener";
    modalTitle.style.pointerEvents = "auto";
    modalTitle.style.cursor = "pointer";
  } else {
    modalTitle.removeAttribute("href");
    modalTitle.removeAttribute("target");
    modalTitle.removeAttribute("rel");
    modalTitle.style.pointerEvents = "none";
    modalTitle.style.cursor = "default";
  }

  lastFocused = document.activeElement;
  modal.classList.add('active');
  modal.setAttribute('aria-hidden', 'false');
  modalClose.focus();
}

function closeModal() {
  modal.classList.remove('active');
  modal.setAttribute('aria-hidden', 'true');
  if (lastFocused) {
    lastFocused.focus();
  }
}

gallery.addEventListener('click', (e) => {
  const btn = e.target.closest('button');
  if (btn) {
    openModal(btn);
  }
});

modal.addEventListener('click', (e) => {
  if (e.target === modal) {
    closeModal();
  }
});

modalClose.addEventListener('click', closeModal);

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && modal.classList.contains('active')) {
    closeModal();
  }
});

const header = document.getElementById('siteHeader');
window.addEventListener('scroll', () => {
  header.classList.toggle('scrolled', window.scrollY > 8);
}, { passive: true });
</script>
